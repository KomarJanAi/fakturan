name: Image

# Builds the production image on GitHub (the Coolify VPS has too little RAM to build it)
# and publishes it to GHCR on every push to the deploy branch. The image job runs its own PDF smoke test;
# workflow_run gating is not possible because the fork's default branch has no copy of this file.
on:
  push:
    branches: [deploy]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHA="$(git rev-parse --short HEAD)"
          docker build -t "$IMG:$SHA" -t "$IMG:latest" .
          docker run --rm "$IMG:$SHA" node scripts/pdf-smoke.mjs
          docker push --all-tags "$IMG"

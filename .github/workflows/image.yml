name: Image

# Builds the production image on GitHub (the Coolify VPS has too little RAM to build it)
# and publishes it to GHCR after CI passes on the deploy branch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHA="$(git rev-parse --short HEAD)"
          docker build -t "$IMG:$SHA" -t "$IMG:latest" .
          docker run --rm "$IMG:$SHA" node scripts/pdf-smoke.mjs
          docker push --all-tags "$IMG"
